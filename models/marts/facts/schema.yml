version: 2

models:
  - name: fct_transaction_status
    description: "Fact table capturing transaction status lifecycle"
    columns:
      - name: transaction_id
        description: "Transaction identifier"
        tests:
          - not_null
      
      - name: date_key
        description: "Date of status change (derived from status_datetime)"
        tests:
          - not_null
      
      - name: customer_id
        description: "Foreign key to dim_customer"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      
      - name: status_name
        description: "Foreign key to dim_status"
        tests:
          - not_null
          - relationships:
              to: ref('dim_status')
              field: status_name
      
      - name: transaction_amount
        description: "Transaction amount for aggregations"
        tests:
          - not_null
      
      - name: status_datetime
        description: "Timestamp of status event"
        tests:
          - not_null
