version: 2

models:
  - name: dim_customer
    description: "Customer dimension"
    columns:
      - name: customer_id
        description: "Primary key - unique customer identifier"
        tests:
          - unique
          - not_null
      
      - name: country_code
        description: "Standardized country code"
        tests:
          - not_null
  
  - name: dim_status
    description: "Status dimension with terminal status indicator"
    columns:
      - name: status_name
        description: "Primary key - normalized status name"
        tests:
          - unique
          - not_null
      
      - name: is_terminal_status
        description: "Boolean indicating if status is terminal (completed, cancelled, failed, declined)"
        tests:
          - not_null
  
  - name: dim_date
    description: "Date dimension for time-based analysis"
    columns:
      - name: date_key
        description: "Primary key - date value"
        tests:
          - unique
          - not_null
      
      - name: year
        description: "Year extracted from date"
        tests:
          - not_null
      
      - name: month
        description: "Month extracted from date"
        tests:
          - not_null
      
      - name: day_of_week
        description: "Day of week name"
        tests:
          - not_null
