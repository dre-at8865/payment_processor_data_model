version: 2

models:
  - name: int_transactions_deduplicated
    description: |
      Deduplicated transactions using business rule: keep earliest transaction_datetime.
      Removes 5 duplicate transaction_ids from staging (151 → 146 unique transactions).
    columns:
      - name: transaction_id
        description: "Unique transaction identifier after deduplication"
        tests:
          - unique
          - not_null
      
      - name: customer_id
        description: "Reference to customer"
        tests:
          - not_null
      
      - name: transaction_amount
        description: "Transaction amount"
        tests:
          - not_null
      
      - name: transaction_datetime
        description: "Transaction timestamp (earliest for duplicate IDs)"
        tests:
          - not_null
